name: CI

on:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  native:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            format: deb
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            format: deb
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            format: rpm
          - os: macos-latest
            target: x86_64-macos
            format: zip
          - os: macos-latest
            target: aarch64-macos
            format: zip
          - os: windows-latest
            target: x86_64-windows-gnu
            format: nsis
          - os: windows-latest
            target: aarch64-windows-gnu
            format: nsis

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check src build.zig examples/build.zig examples/src

      - name: Test
        run: zig build test

      - name: Native build
        working-directory: examples
        run: zig build bundle -Dformat=${{ matrix.format }} -Dtarget=${{ matrix.target }}

  windows-installer:
    name: Windows installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build installers
        working-directory: examples
        shell: pwsh
        run: |
          zig build bundle -Dformat=nsis -Dtarget=x86_64-windows-gnu '-Dapp-version=0.1.0'
          zig build bundle -Dformat=nsis -Dtarget=x86_64-windows-gnu '-Dapp-version=0.2.0'

      - name: Run installer smoke test
        shell: pwsh
        run: ./scripts/windows-installer-test.ps1

  cross:
    name: cross (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-build
        working-directory: examples
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.os }}" in
            ubuntu-*)
              zig build bundle -Dformat=nsis -Dtarget=x86_64-windows-gnu
              zig build bundle -Dformat=nsis -Dtarget=aarch64-windows-gnu
              zig build bundle -Dformat=zip -Dtarget=x86_64-macos
              zig build bundle -Dformat=zip -Dtarget=aarch64-macos
              ;;
            macos-*)
              zig build bundle -Dformat=deb -Dtarget=x86_64-linux-gnu
              zig build bundle -Dformat=deb -Dtarget=aarch64-linux-gnu
              zig build bundle -Dformat=nsis -Dtarget=x86_64-windows-gnu
              zig build bundle -Dformat=nsis -Dtarget=aarch64-windows-gnu
              ;;
            windows-*)
              zig build bundle -Dformat=deb -Dtarget=x86_64-linux-gnu
              zig build bundle -Dformat=deb -Dtarget=aarch64-linux-gnu
              zig build bundle -Dformat=zip -Dtarget=x86_64-macos
              zig build bundle -Dformat=zip -Dtarget=aarch64-macos
              ;;
          esac
